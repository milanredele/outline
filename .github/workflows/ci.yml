name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # The runner of release.yml, so that this checks what a release builds on.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: alire-project/setup-alire@fc4c8ce471aa30b3af0d39ce15add1ee9eaf28f2 # v6.0.0
      # Build, lexer cases and config cases. The proof and the reference set are not run here:
      # no gnatprove, and the corpora are not available (see README.md).
      - run: tests/run.sh
